<!doctype html>
<meta charset="utf-8">
<title>HTML and SVG class interoperability</title>
<pre id="result">Running…</pre>
<script type="module">
    import { DomInterop } from "../../../src/NativeUI.Controls.Web/wwwroot/nativeui-dom.js";

    import { ImageElement } from "../../../src/NativeUI.Controls.Web/wwwroot/elements/nativeui-image.js";

    const result = document.querySelector("#result");
    const assert = (condition, message) => {
        if (!condition) throw new Error(message);
    };

    try {
        const html = document.createElement("div");
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        for (const element of [html, svg, path]) {
            const isSvg = element.namespaceURI === "http://www.w3.org/2000/svg";
            const getClass = isSvg ? ImageElement.getSvgClassName : DomInterop.getClassName;
            const setClass = isSvg ? ImageElement.setSvgClassName : DomInterop.setClassName;
            assert(getClass(element) === "", "Missing class must read as an empty string");
            setClass(element, "image active");
            assert(getClass(element) === "image active", "Class must round-trip as a string");
            assert(element.classList.contains("active"), "The native class list must update");
            setClass(element, null);
            assert(getClass(element) === "", "Clearing class must work for HTML and SVG");
        }
        result.textContent = "PASS: HTML, SVG, and path classes can be set, read, and cleared.";
    } catch (error) {
        result.textContent = "FAIL: " + error.stack;
        throw error;
    }
</script>
