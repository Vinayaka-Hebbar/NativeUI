<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NativeUI Web Sample</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #e2e8f0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body:has(native-ui[data-theme="dark"]) {
            background: #1e293b;
        }
        @media (prefers-color-scheme: dark) {
            body:not(:has(native-ui)) {
                background: #1e293b;
            }
        }
        #app {
            width: min(680px, 92vw);
        }
    </style>
</head>
<body>
    <main id="app"></main>
    <script type="module" src="./_content/NativeUI.Controls.Web/nativeui.js"></script>
</body>
</html>
