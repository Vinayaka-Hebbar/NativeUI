<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NativeUI Web Sample</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
            color: #0f172a;
            font-family: system-ui, -apple-system, sans-serif;
        }
        html:has(native-ui[data-theme="dark"]),
        body:has(native-ui[data-theme="dark"]) {
            background: #0a0a0a;
            color: #fafafa;
        }
        @media (prefers-color-scheme: dark) {
            html:not(:has(native-ui)),
            body:not(:has(native-ui)) {
                background: #0a0a0a;
                color: #fafafa;
            }
        }
        #app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        native-ui {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
        }
    </style>
</head>
<body>
    <main id="app"></main>
    <script type="module" src="./_content/NativeUI.Controls.Web/nativeui.js"></script>
</body>
</html>
